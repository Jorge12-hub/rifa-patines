<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Donación Deportiva - Patines</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 500px;
    }

    /* Grilla de números */
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin: 20px 0;
    }

    .number-btn {
      padding: 10px 0;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s, transform 0.1s;
    }

    /* Estado Activo / Disponible (Verde) */
    .number-btn.active {
      background-color: #10b981;
    }
    .number-btn.active:hover {
      background-color: #059669;
      transform: scale(1.05);
    }

    /* Estado Desactivado / Comprado (Rosado) */
    .number-btn.disabled {
      background-color: #f43f5e;
      cursor: not-allowed;
      opacity: 0.85;
    }

    /* Estado Seleccionado para compra (Azul) */
    .number-btn.selected {
      background-color: #2563eb;
    }

    /* Panel de Administración */
    .admin-panel {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px dashed #ccc;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .admin-panel input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .admin-btn {
      padding: 8px 12px;
      background-color: #1e3a8a;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .admin-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

<div class="container">
  <h3>Elije tu número disponible (00 - 99):</h3>
  
  <!-- Grilla donde se generan los botones -->
  <div class="grid" id="numberGrid"></div>

  <!-- Panel inferior de administración -->
  <div class="admin-panel">
    <input type="password" id="adminKey" placeholder="Clave de admin">
    <input type="text" id="targetNum" placeholder="N° (ej: 05)" maxlength="2" style="width: 70px;">
    <button class="admin-btn" onclick="toggleNumberState()">✓ Cambiar Estado</button>
  </div>
</div>

<script>
  // Clave de administración configurada
  const ADMIN_PASSWORD = "85304564547"; 

  // Generar cuadrícula de 00 a 99 al cargar
  const grid = document.getElementById('numberGrid');

  for (let i = 0; i <= 99; i++) {
    const numStr = i.toString().padStart(2, '0');
    const btn = document.createElement('button');
    btn.className = 'number-btn active'; // Inician todos en verde (activos)
    btn.textContent = numStr;
    btn.dataset.number = numStr;

    // Evento de selección para el usuario
    btn.addEventListener('click', () => {
      if (btn.classList.contains('disabled')) {
        alert(`El número ${numStr} está desactivado o ya fue comprado.`);
        return;
      }
      // Alternar selección
      btn.classList.toggle('selected');
    });

    grid.appendChild(btn);
  }

  // Función para Activar/Desactivar números con clave
  function toggleNumberState() {
    const keyInput = document.getElementById('adminKey').value;
    const numInput = document.getElementById('targetNum').value.padStart(2, '0');

    if (keyInput !== ADMIN_PASSWORD) {
      alert("Clave incorrecta. No tienes permiso para modificar el estado.");
      return;
    }

    const btn = document.querySelector(`.number-btn[data-number="${numInput}"]`);

    if (!btn) {
      alert("Número no válido. Ingrese un valor entre 00 y 99.");
      return;
    }

    // Alternar entre activo (verde) y desactivado/rosado
    if (btn.classList.contains('disabled')) {
      btn.classList.remove('disabled');
      btn.classList.add('active');
      alert(`El número ${numInput} ha sido ACTIVADO (Disponible - Verde).`);
    } else {
      btn.classList.remove('active', 'selected');
      btn.classList.add('disabled');
      alert(`El número ${numInput} ha sido DESACTIVADO (Comprado - Rosado).`);
    }

    // Limpiar campos
    document.getElementById('targetNum').value = '';
  }
</script>

</body>
</html>
